[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genquesai"
version = "0.1.0"
description = "Sinh bộ đề eval và chấm hệ RAG pháp luật từ cây văn bản QPPL"
requires-python = ">=3.12"
dependencies = []

# `framework` chạy được trên máy TRẮNG — không Neo4j, không Qdrant, không legal-rag
# (ROADMAP A3). Đường JSONL + tầng truy vấn + tầng chấm đều thuần stdlib. Chỉ khi nạp
# thẳng từ đồ thị mới cần nhóm phụ thuộc dưới đây.
[project.optional-dependencies]
neo4j = ["neo4j>=5", "qdrant-client>=1.7"]
dev = ["pytest>=8"]
# legal_rag/ — clone cơ chế CDI (xem legal_rag/__init__.py). Core: parse/ingest/gate/ledger.
cdi = [
    "neo4j>=5.26",
    "qdrant-client>=1.12",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.2",
    "selectolax>=0.4.10",
    "httpx>=0.27",
    "watchdog>=4",
    "rapidfuzz>=3",
    "openai>=1.0",   # generator/paraphrase.py::make_llm (genquesai.legal_rag.agent.llm)
]
# Chỉ cần cho `legal_rag embed` / `legal_rag cdi watch` (nhúng bge-m3) — nặng (torch+CUDA).
cdi-embed = ["torch>=2.12", "sentence-transformers>=5.5.1", "flagembedding>=1.4.0"]

[project.scripts]
genquesai = "genquesai.cli:main"

[tool.setuptools]
packages = [
    "framework", "generator", "evaluate", "genquesai",
    "genquesai.legal_rag", "genquesai.legal_rag.cdi", "genquesai.legal_rag.domain",
    "genquesai.legal_rag.ingestion", "genquesai.legal_rag.graph",
    "genquesai.legal_rag.retrieval", "genquesai.legal_rag.agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import mode `importlib` + rootdir trên sys.path: `tests/` có `__init__.py` nên các
# module trong đó import lẫn nhau bằng `tests.x` được.
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
